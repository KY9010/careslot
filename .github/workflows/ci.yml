# Runs on every push and pull request: format, lint, type-check, test, build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careslot
          POSTGRES_PASSWORD: careslot
          POSTGRES_DB: careslot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careslot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://careslot:careslot@localhost:5432/careslot?schema=public
      SESSION_SECRET: ci-only-secret-that-is-at-least-32-characters-long
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
